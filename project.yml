name: RawAIBatch
options:
  bundleIdPrefix: com.rawaibatch
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    ARCHS: arm64
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  RawAICore:
    path: Packages/RawAICore
targets:
  RawAIBatch:
    type: application
    platform: macOS
    sources:
      - App/Sources
    entitlements:
      path: App/RawAIBatch.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rawaibatch.app
        PRODUCT_NAME: RawAIBatch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "RAW AI 批处理"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEAD_CODE_STRIPPING: YES
    dependencies:
      - package: RawAICore
        product: CoreModels
      - package: RawAICore
        product: RawDecoding
      - package: RawAICore
        product: ImagePipeline
      - package: RawAICore
        product: AIEngine
      - package: RawAICore
        product: BatchProcessing
schemes:
  RawAIBatch:
    build:
      targets:
        RawAIBatch: all
    run:
      config: Debug
    archive:
      config: Release
